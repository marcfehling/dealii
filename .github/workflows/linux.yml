name: linux

on:
  push:
    branches:
      - 'master'
      - 'dealii-*'
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1
  CTEST_PARALLEL_LEVEL: 4
  MAKEFLAGS: "--jobs=4"

jobs:

  #################
  # debug-cuda-12 #
  #################

  debug-cuda-12:
    # simple parallel debug build using cuda-12

    name: noble debug cuda-12
    runs-on: ubuntu-24.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    env:
      CUDA_ROOT: /usr/local/cuda

    steps:
    - uses: actions/checkout@v7
    - name: modules
      run: |
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:ginggs/deal.ii-9.7.1-backports
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
            cuda-toolkit-12-5 \
            libp4est-dev \
            libopenmpi-dev \
            numdiff \
            openmpi-bin \
            libboost-all-dev
    # https://github.com/apache/flink/blob/master/tools/ci/free_disk_space.sh
    - name: remove unused large packages
      run : |
        echo "=============================================================================="
        echo "Freeing up disk space on CI system"
        echo "=============================================================================="

        echo "Listing 100 largest packages"
        dpkg-query -Wf '${Installed-Size}\t${Package}\n' | sort -n | tail -n 100
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y '^llvm-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y azure-cli google-cloud-sdk google-chrome-stable firefox powershell mono-devel
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h
        echo "Removing large directories"
        # deleting 15GB
        rm -rf /usr/share/dotnet/
        df -h
    - name: info
      run: |
        mpicc -v
        cmake --version
    - uses: actions/checkout@v7
      with:
        repository: kokkos/kokkos
        ref: 4.4.01
        path: kokkos
    - name: compile and install kokkos
      working-directory: kokkos
      run: |
        mkdir build
        cd build
        cmake -D BUILD_SHARED_LIBS=ON \
              -D CMAKE_CXX_COMPILER=${GITHUB_WORKSPACE}/kokkos/bin/nvcc_wrapper \
              -D CMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/../kokkos-install \
              -D Kokkos_ENABLE_CUDA=ON \
              -D Kokkos_ENABLE_CUDA_LAMBDA=ON \
              -D Kokkos_ENABLE_CUDA_CONSTEXPR=ON \
              -D Kokkos_ARCH_AMPERE80=ON \
              ..
        make install
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_COMPILER=${GITHUB_WORKSPACE}/kokkos/bin/nvcc_wrapper \
              -D DEAL_II_CXX_FLAGS='-Werror -Wno-non-template-friend' \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_KOKKOS="ON" \
              -D KOKKOS_DIR=${GITHUB_WORKSPACE}/../kokkos-install \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_MPI_WITH_DEVICE_SUPPORT="ON" \
              -D DEAL_II_WITH_P4EST="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build deal.II
      run: |
        cd build
        make VERBOSE=1
    - name: build CUDA tests
      run: |
        cd build
        make setup_tests_matrix_free_kokkos
        cd tests/matrix_free_kokkos
        make compile_test_executables

  #######################
  # debug-cuda-12-clang #
  #######################

  debug-cuda-12-clang:
    # simple parallel debug build using cuda-12 and clang

    name: noble debug cuda-12 clang
    runs-on: ubuntu-24.04

    #
    # The following condition only runs the workflow on 'push' or if the
    # 'pull_request' is not a draft. This is only useful for hackathons or
    # other situations when the CI is massively overburdened with pull
    # requests.
    #
    # if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}

    env:
      CUDA_ROOT: /usr/local/cuda

    steps:
    - uses: actions/checkout@v7
    - name: modules
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:ginggs/deal.ii-9.7.1-backports
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
            cuda-toolkit-12-5 \
            libp4est-dev \
            libopenmpi-dev \
            numdiff \
            openmpi-bin \
            libboost-all-dev
    - name: info
      run: |
        mpicc -v
        clang++-22 -v
        cmake --version
    - uses: actions/checkout@v7
      with:
        repository: kokkos/kokkos
        ref: 4.4.01
        path: kokkos
    - name: compile and install kokkos
      working-directory: kokkos
      run: |
        mkdir build
        cd build
        cmake -D BUILD_SHARED_LIBS=ON \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D CMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/../kokkos-install \
              -D Kokkos_ENABLE_CUDA=ON \
              -D Kokkos_ARCH_NATIVE=ON \
              -D Kokkos_ARCH_AMPERE80=ON \
              ..
        make install
    - name: configure deal.II
      run: |
        mkdir build
        cd build
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_COMPILER=clang++-22 \
              -D DEAL_II_FORCE_BUNDLED_BOOST=ON \
              -D DEAL_II_EARLY_DEPRECATIONS=ON \
              -D DEAL_II_WITH_KOKKOS="ON" \
              -D KOKKOS_DIR=${GITHUB_WORKSPACE}/../kokkos-install \
              -D DEAL_II_WITH_MPI="ON" \
              -D DEAL_II_MPI_WITH_DEVICE_SUPPORT="OFF" \
              -D DEAL_II_WITH_P4EST="ON" \
              ..
    - name: print detailed.log
      run: cat build/detailed.log
    - name: build deal.II
      run: |
        cd build
        make VERBOSE=1
    - name: build CUDA tests
      run: |
        cd build
        make setup_tests_matrix_free_kokkos
        cd tests/matrix_free_kokkos
        make compile_test_executables
